get:
  tags:
    - Executions
  summary: Retrieve execution details
  description: >-
    Retrieve an execution's metadata.
    Output can be fetch using GET /runs/{id}/output endpoint for terminal executions
    (succeeded, failed, timed_out).
  operationId: getExecution
  parameters:
    - name: id
      in: path
      required: true
      description: Execution ID (UUID)
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Execution details
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Execution.yaml
    '404':
      description: Execution not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            kind: Error
            code: not-found
            reason: Execution not found
