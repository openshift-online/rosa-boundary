type: object
required:
  - kind
  - code
  - reason
properties:
  kind:
    type: string
    enum:
      - Error
    description: Always "Error"
  code:
    type: string
    description: Machine-readable error code
    example: invalid-params
  reason:
    type: string
    description: Human-readable error message
    example: specify namespace or set all_namespaces=true
