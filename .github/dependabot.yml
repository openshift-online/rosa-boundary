version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/lambda/create-investigation"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      all-pip:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      aws-sdk:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
