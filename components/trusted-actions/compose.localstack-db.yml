# Licensed LocalStack with RDS (a Pro feature). The auth token is supplied
# via the LOCALSTACK_AUTH_TOKEN environment variable and never committed —
# the required-variable check lives in the provisioning script so teardown
# works in a fresh shell without the token.
#
# Image pinned to the digest verified with RDS + IAM database auth.
services:
  localstack-db:
    image: docker.io/localstack/localstack-pro@sha256:4442ad61e208b475a95b70d5fdd0f15e2dda83c3fc33d60f85521702180b11f6
    container_name: rosa-ta-localstack-db
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
      - LOCALSTACK_ACCOUNT_ID=123456789012
      - ENFORCE_IAM=0
    ports:
      - "127.0.0.1:4567:4566"
    volumes:
      - localstack-db-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_localstack/health')"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  localstack-db-data:
