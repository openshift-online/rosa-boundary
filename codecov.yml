codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "50...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

ignore:
  - "vendor/**"
  - "**/mock_*.go"
  - "**/*_mock.go"
  - "**/zz_generated*.go"
  - "**/fake_*.go"
  - "test/**"
  - "tests/**"
  - "docs/**"
  - "scripts/**"
  - "skel/**"
  - "build/**"
  - "deploy/**"
  - "lambda/**"

flags:
  go-unit-tests:
    carryforward: true

comment:
  layout: "header,diff,flags,files,footer"
  behavior: default
  require_changes: false
  require_base: true
  require_head: true
  hide_project_coverage: false
