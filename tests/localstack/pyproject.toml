# Compatibility project for openshift/release's Python 3.11 CI image build.
# Local development uses the root uv project; dependencies come from its group.
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rosa-boundary-localstack-tests"
version = "0.1.0"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
py-modules = []
