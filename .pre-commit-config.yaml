repos:
  - repo: local
    hooks:
      - id: skillsaw
        name: skillsaw
        entry: uv run skillsaw lint .
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.15.0
    hooks:
      - id: golangci-lint
        # Boundary and Trusted Actions have separate Go modules and lint configs.
        exclude: ^components/trusted-actions/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks
        name: gitleaks (Trusted Actions)
        files: ^components/trusted-actions/
  - repo: local
    hooks:
      - id: trusted-actions-go-build
        name: go build (Trusted Actions)
        entry: bash -c 'cd components/trusted-actions && go build ./...'
        language: system
        files: ^components/trusted-actions/(.*\.go|go\.(mod|sum))$
        pass_filenames: false
